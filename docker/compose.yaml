services:
  db:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    container_name: atlora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atlora
    ports:
      # Host already runs Postgres.app on 5432 (confirmed in Phase 0), so
      # the container is published on 5433 instead. As of Milestone 3, the
      # containerized `api` and `migrate` reach this over the compose
      # network as `db:5432` — 5433 is for direct host psql/drizzle-kit
      # access only.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Mounted read-only: Postgres only executes *.sql/*.sh files here, in
      # lexical order, and only against a freshly-initialized (empty) data
      # volume. docker/init/01-roles.sql lands in Milestone 2 — see
      # docker/init/README.md.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: atlora-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket the app actually uses (R2_BUCKET_NAME=
  # atlora-travel, confirmed in Phase 0) and makes it anonymously
  # downloadable, mirroring how R2_PUBLIC_URL serves media today. Exits
  # after running; not part of the long-running service set.
  storage-init:
    image: quay.io/minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: atlora-storage-init
    depends_on:
      storage:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://storage:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/atlora-travel &&
        mc anonymous set download local/atlora-travel

  # One-shot: applies pending Drizzle migrations, then exits. Deliberately
  # not run from the api container's entrypoint — every replica would race
  # to apply the same migration on boot (fine at one replica, a confusing
  # intermittent failure the moment there's more than one). Connects as
  # atlora_owner, the only role with DDL rights (docker/init/01-roles.sql);
  # `api` itself connects as atlora_app and cannot run this.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: installer
    container_name: atlora-migrate
    working_dir: /app/packages/db
    command: ["pnpm", "run", "migrate"]
    environment:
      DATABASE_URL: postgresql://atlora_owner:atlora_owner@db:5432/atlora
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: atlora-api
    restart: unless-stopped
    # R2_* creds (unused unless STORAGE_DRIVER=r2) come from the host .env
    # (gitignored, never baked into the image — see apps/api/.env.example).
    # Every var in `environment:` below overrides whatever's in that file:
    # the containerized api always talks to the containerized db/storage
    # over the compose network, never the host-published ports
    # apps/api/.env points at for `pnpm dev`.
    env_file:
      - ../apps/api/.env
    environment:
      DATABASE_URL: postgresql://atlora_app:atlora_app@db:5432/atlora
      STORAGE_DRIVER: minio
      # Real, reachable-from-this-container endpoint for actual S3 calls
      # (put/delete/list) — the compose service name, not localhost.
      MINIO_ENDPOINT: http://storage:9000
      # A signed URL's host is part of what's signed, and only this one is
      # resolvable by the browser that will actually use it — signing
      # itself is a local computation, so this endpoint never needs to be
      # reachable FROM the container. See apps/api/src/lib/storage/
      # s3Driver.ts for the full explanation.
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_BUCKET_NAME: atlora-travel
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    # No published host port on purpose — every surface goes through the
    # proxy (docker/Caddyfile routes /api/* to this service by name).
    # Publishing 3001 here would let something bypass the proxy, which
    # silently breaks the Secure/SameSite=Lax cookie flow (see CLAUDE.md /
    # the Docker handoff's Auth section).

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    container_name: atlora-admin
    restart: unless-stopped
    # No published host port, no depends_on — a static Caddy file server
    # with no backend of its own. Same "proxy-only" reasoning as `api`.

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: atlora-web
    restart: unless-stopped
    # No published host port, no depends_on — apps/web makes no API calls
    # yet (confirmed in Phase 0: no fetch/trpc usage in its two pages).
    # Same "proxy-only" reasoning as `api`/`admin`.

  proxy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: atlora-proxy
    restart: unless-stopped
    depends_on:
      - api
      - admin
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      # Docker Desktop for Mac already provides this; explicit for
      # portability to a Linux dev machine.
      - "host.docker.internal:host-gateway"

volumes:
  db_data:
  storage_data:
  caddy_data:
  caddy_config:
